[package]
name = "depx"
version = "0.6.0"
edition = "2021"
description = "Intelligent dependency analyzer for JavaScript/TypeScript and Rust projects"
license = "MIT"
repository = "https://github.com/ruidosujeira/depx"
homepage = "https://github.com/ruidosujeira/depx"
readme = "README.md"
keywords = ["javascript", "typescript", "npm", "cargo", "dependencies"]
categories = ["command-line-utilities", "development-tools"]
# Development-only fixtures, automation and duplicate demo sources are not
# needed to build or use the crate. The README asset stays for crates.io.
exclude = [".github", "examples", "assets/demo.tape", "/demo.gif"]

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# JS/TS parsing
oxc_parser = "0.44"
oxc_span = "0.44"
oxc_allocator = "0.44"
oxc_ast = "0.44"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
toml = "0.8"

# Error handling & diagnostics
miette = { version = "7", features = ["fancy"] }

# Async & HTTP
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
httpdate = "1"

# Utilities
ignore = "0.4"
globset = "0.4"
petgraph = "0.6"
semver = "1"
colored = "2"

[profile.release]
lto = true
codegen-units = 1
